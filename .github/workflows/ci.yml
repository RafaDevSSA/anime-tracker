name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm test --if-present
      - run: npm run lint --if-present

  mcp-anime-search:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcps/anime-search-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm test

  mcp-schedule-scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcps/schedule-scraper-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm test
