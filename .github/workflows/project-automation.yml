name: Project automation

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [closed]

jobs:
  add-issue-to-project:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/RafaDevSSA/projects/1
          github-token: ${{ secrets.PROJECT_AUTOMATION_PAT }}

  close-card-on-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Mark linked issues as Done
        env:
          GH_TOKEN: ${{ secrets.PROJECT_AUTOMATION_PAT }}
        run: |
          gh issue list --repo ${{ github.repository }} --search "linked:pr-${{ github.event.pull_request.number }}" --json number --jq '.[].number' | while read -r num; do
            gh project item-edit --project-id PVT_kwHOA7Hqc84BZ0PD --id "$(gh project item-list 1 --owner RafaDevSSA --format json | jq -r --arg n "$num" '.items[] | select(.content.number == ($n | tonumber)) | .id')" --field-id PVTSSF_lAHOA7Hqc84BZ0PDzhUwSkc --single-select-option-id 98236657
          done
