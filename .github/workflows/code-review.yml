name: Code Review (Claude)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['**']

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install review skill dependencies
        run: npm install --prefix /tmp/review-deps @anthropic-ai/sdk ts-node typescript

      - name: Run Claude Code Review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"
          CONTEXT="PR: ${{ github.event.pull_request.title }}"

          OUTPUT=$(node -r /tmp/review-deps/node_modules/ts-node/register \
            skills/code-review-skill/cli.ts \
            "origin/$BASE" "origin/$HEAD" "$CONTEXT" 2>&1) || FAILED=true

          echo "REVIEW_OUTPUT<<EOF" >> $GITHUB_ENV
          echo "$OUTPUT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          if [ "$FAILED" = "true" ]; then
            echo "REVIEW_STATUS=failed" >> $GITHUB_ENV
          else
            echo "REVIEW_STATUS=passed" >> $GITHUB_ENV
          fi

      - name: Post review comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = process.env.REVIEW_OUTPUT || 'Sem output';
            const status = process.env.REVIEW_STATUS;

            const header = status === 'passed'
              ? '## ✅ Code Review — Aprovado\n\n'
              : '## 🚫 Code Review — Requer atenção\n\n';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: header + output + '\n\n---\n*Revisão automática gerada por Claude Sonnet*'
            });
